name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    # 매일 오전 09:17 KST (UTC 00:17) — GitHub 일정에 따라 지연될 수 있습니다.
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate light and dark snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%232D85D3&color_dots=%23EDF2F7,%23D7E9FF,%239CC6F1,%235D9CDC,%232C6BA5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2377C9FF&color_dots=%23161B22,%23253A53,%23375F80,%234D88B1,%2367B8ED

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update contribution snake [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
