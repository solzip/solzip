name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    # 매일 오전 09:17 KST (UTC 00:17). GitHub 스케줄에 따라 실제 실행은 지연될 수 있습니다.
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Update contribution images on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate light and dark snakes from real contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=%232D85D3&color_dots=%23EDF2F7,%23D7E9FF,%239CC6F1,%235D9CDC,%232C6BA5
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2377C9FF&color_dots=%23161B22,%23253A53,%23375F80,%234D88B1,%2367B8ED

      - name: Commit images only when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No changes to contribution images."
            exit 0
          fi
          git commit -m "chore(profile): refresh contribution snake [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
